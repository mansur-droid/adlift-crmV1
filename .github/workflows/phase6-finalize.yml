name: Phase 6 finalize integration
on:
  push:
    branches: [phase6-twilio-telephony]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize source integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/AICallingAdmin.jsx')
          s=p.read_text()
          if "import ControlledTestCall" not in s:
              s=s.replace("import AIEligibilityPanel from'./AIEligibilityPanel';", "import AIEligibilityPanel from'./AIEligibilityPanel';\nimport ControlledTestCall from'./ControlledTestCall';")
          s=s.replace("['providers','Providers',Server],['eligibility','Eligibility & Queue',Bot]]", "['providers','Providers',Server],['eligibility','Eligibility & Queue',Bot],['controlled','Controlled Test Call',Bot]]")
          if "section==='controlled'" not in s:
              s=s.replace("{section==='eligibility'&&<AIEligibilityPanel campaigns={campaigns}/>}", "{section==='eligibility'&&<AIEligibilityPanel campaigns={campaigns}/>}\n  {section==='controlled'&&<ControlledTestCall campaigns={campaigns}/>}")
          s=s.replace("Configure the AI SDR safely. Telephony is not connected yet, so campaign controls configure data only and cannot place calls.", "Configure the AI SDR safely. Phase 6 telephony is controlled-test only; bulk campaign dialing and automatic queue consumption remain disabled.")
          s=s.replace("<Status ok={false}>Telephony not connected</Status>", "<Status ok={false}>Controlled test only</Status>")
          p.write_text(s)
          p=Path('supabase/migrations/20260812040000_ai_voice_phase6_twilio.sql')
          s=p.read_text()
          old=" select count(*),min(r.id) into prospect_count,prospect_id from public.crm_records r\n where r.type='stats' and coalesce((r.payload->>'deleted')::boolean,false)=false and public.ai_normalize_phone(r.payload->>'phone')=p_phone_e164;\n if prospect_count=0 then return jsonb_build_object('reserved',false,'reason','stats_prospect_not_found'); end if;\n if prospect_count>1 then return jsonb_build_object('reserved',false,'reason','ambiguous_stats_prospect_match'); end if;\n perform 1 from public.crm_records where id=prospect_id for update;"
          new=" select count(*) into prospect_count from public.crm_records r\n where r.type='stats' and coalesce((r.payload->>'deleted')::boolean,false)=false and public.ai_normalize_phone(r.payload->>'phone')=p_phone_e164;\n if prospect_count=0 then return jsonb_build_object('reserved',false,'reason','stats_prospect_not_found'); end if;\n if prospect_count>1 then return jsonb_build_object('reserved',false,'reason','ambiguous_stats_prospect_match'); end if;\n select r.id into prospect_id from public.crm_records r where r.type='stats' and coalesce((r.payload->>'deleted')::boolean,false)=false and public.ai_normalize_phone(r.payload->>'phone')=p_phone_e164 limit 1;\n perform 1 from public.crm_records where id=prospect_id for update;"
          s=s.replace(old,new)
          p.write_text(s)
          p=Path('api/ai-controlled-test-call.js')
          s=p.read_text()
          s=s.replace("await admin.from('ai_call_events').upsert({attempt_id:attemptId,event_type:'telephony.originated',event_source:'system',provider_slug:'twilio',provider_event_id:`origin:${call.sid}`,payload:{callSid:call.sid,status:call.status||'queued'}},{onConflict:'provider_slug,provider_event_id',ignoreDuplicates:true});", "await admin.from('ai_call_events').insert({attempt_id:attemptId,event_type:'telephony.originated',event_source:'system',provider_slug:'twilio',provider_event_id:`origin:${call.sid}`,payload:{callSid:call.sid,status:call.status||'queued'}});")
          p.write_text(s)
          PY
      - name: Reconcile package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit finalized integration
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/AICallingAdmin.jsx package-lock.json api/ai-controlled-test-call.js supabase/migrations/20260812040000_ai_voice_phase6_twilio.sql
            git commit -m "Finalize Phase 6 admin integration and lockfile"
            git push origin HEAD:phase6-twilio-telephony
          fi
