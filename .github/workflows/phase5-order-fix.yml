name: Phase 5 reason ordering fix
on:
  push:
    branches: [phase5-eligibility-engine]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Put queued/active checks before retry cooldown
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260812030000_ai_voice_phase5_eligibility.sql')
          s=p.read_text()
          block="""  if exists(select 1 from public.ai_call_attempts where prospect_record_id=r.id and status in ('queued','claimed','initiating','ringing','connected','active_conversation')) then
    return jsonb_build_object('eligible',false,'reason_code','prospect_already_queued_or_active');
  end if;
  select count(*) into active_phone from public.ai_call_attempts where phone_e164=phone and status in ('claimed','initiating','ringing','connected','active_conversation');
  if active_phone>0 then return jsonb_build_object('eligible',false,'reason_code','phone_already_active','phone_e164',phone); end if;

"""
          marker="  select count(*), max(coalesce(ended_at,started_at,created_at)) into attempts_count,last_attempt\n"
          if s.find(block) > s.find(marker):
              s=s.replace(block,'',1)
              s=s.replace(marker,block+marker,1)
              p.write_text(s)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/migrations/20260812030000_ai_voice_phase5_eligibility.sql
            git commit -m "Prioritize queue and active-call eligibility reasons"
            git push
          fi
