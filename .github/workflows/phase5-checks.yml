name: Phase 5 checks

on:
  push:
    branches: [phase5-eligibility-engine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase5:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalize Phase 5 UI and callback snapshot handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/AICallingAdmin.jsx')
          s=p.read_text()
          if "AIEligibilityPanel" not in s:
              s=s.replace("import{supabase}from'./supabaseClient';", "import{supabase}from'./supabaseClient';\nimport AIEligibilityPanel from'./AIEligibilityPanel';")
          s=s.replace("['providers','Providers',Server]]", "['providers','Providers',Server],['eligibility','Eligibility & Queue',Bot]]")
          if "section==='eligibility'" not in s:
              marker="  {section==='providers'&&<>"
              s=s.replace(marker,"  {section==='eligibility'&&<AIEligibilityPanel campaigns={campaigns}/>}\n"+marker)
          if 'Maximum calls total' not in s:
              needle='<Field label="Maximum calls/day"><input type="number" value={row.max_calls_per_day||1} onChange={e=>set(\'max_calls_per_day\',+e.target.value)}/></Field>'
              s=s.replace(needle, needle+'<Field label="Maximum calls total"><input type="number" value={row.max_calls_total||\'\'} onChange={e=>set(\'max_calls_total\',e.target.value?+e.target.value:null)}/></Field>')
          s=s.replace("compliance_settings:{qualification_criteria:'',agent_personality:'',objection_guidance:'',transfer_criteria:'',appointment_guidance:''},", "compliance_settings:{},")
          s=re.sub(r"\{\[\['agent_personality','Agent personality'\].*?\}\)\}</>\}", "</>}", s, flags=re.S)
          p.write_text(s)

          p=Path('supabase/migrations/20260812030000_ai_voice_phase5_eligibility.sql')
          s=p.read_text()
          s=s.replace("terminal_status text;\n  reason text := 'eligible';", "terminal_status text; callback_due boolean := false;\n  reason text := 'eligible';")
          s=s.replace("   order by cb.scheduled_for asc limit 1;\n  if found and open_cb.scheduled_for>p_at then", "   order by cb.scheduled_for asc limit 1;\n  callback_due := found;\n  if callback_due and open_cb.scheduled_for>p_at then")
          s=s.replace("tz := case when found and open_cb.lead_timezone", "tz := case when callback_due and open_cb.lead_timezone")
          s=s.replace("'timezone_source',case when found then 'callback'", "'timezone_source',case when callback_due then 'callback'")
          s=s.replace("'attempt_number',attempts_count+1,'callback_due',found,'callback_id',case when found then open_cb.id else null end,", "'attempt_number',attempts_count+1,'callback_due',callback_due,'callback_id',case when callback_due then open_cb.id else null end,")
          p.write_text(s)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/AICallingAdmin.jsx supabase/migrations/20260812030000_ai_voice_phase5_eligibility.sql
            git commit -m "Finalize Phase 5 eligibility UI and callback handling"
            git push
          fi

      - name: Reproducible install
        run: npm ci
      - name: Vite build
        run: npm run build

      - name: Prepare Supabase-compatible PostgreSQL
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          do $$ begin create role anon; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role; exception when duplicate_object then null; end $$;
          create schema if not exists auth;
          create table if not exists auth.users(id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          create table if not exists public.crm_records(
            id uuid primary key default gen_random_uuid(), type text not null,
            payload jsonb not null default '{}'::jsonb, created_by uuid references auth.users(id),
            created_at timestamptz not null default now(), updated_at timestamptz not null default now());
          SQL
      - name: Apply Phase 3-5 migrations
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812010000_ai_voice_phase3_foundation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812020000_ai_voice_phase4_admin_fields.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812030000_ai_voice_phase5_eligibility.sql

      - name: Eligibility integration tests
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare c uuid:=gen_random_uuid(); p1 uuid:=gen_random_uuid(); p2 uuid:=gen_random_uuid(); p3 uuid:=gen_random_uuid(); e jsonb; n int;
          begin
            insert into ai_call_campaigns(id,name,status,enabled,timezone_strategy,fixed_timezone,calling_days,calling_window_start,calling_window_end,max_attempts_per_prospect,min_retry_delay_minutes,max_calls_per_day,max_connected_minutes_per_day,max_concurrent_calls,max_calls_total,cost_settings)
            values(c,'Test','active',true,'fixed','Europe/Brussels',array[0,1,2,3,4,5,6],time '00:00',time '23:59',3,60,100,600,10,100,'{"max_daily_spend":"100","max_campaign_spend":"1000"}');
            insert into crm_records(id,type,payload) values
              (p1,'stats',jsonb_build_object('name','Eligible','phone','0032470000001','timezone','Europe/Brussels','status','dialed')),
              (p2,'stats',jsonb_build_object('name','Bad phone','phone','0470000002','timezone','Europe/Brussels','status','dialed')),
              (p3,'stats',jsonb_build_object('name','Booked','phone','+32470000003','timezone','Europe/Brussels','status','booked'));
            e:=ai_evaluate_call_eligibility(c,p1,now()); if e->>'reason_code'<>'eligible' then raise exception 'expected eligible: %',e; end if;
            if e->>'phone_e164'<>'+32470000001' then raise exception 'phone normalization failed: %',e; end if;
            e:=ai_evaluate_call_eligibility(c,p2,now()); if e->>'reason_code'<>'phone_invalid_or_ambiguous' then raise exception 'expected ambiguous phone: %',e; end if;
            e:=ai_evaluate_call_eligibility(c,p3,now()); if e->>'reason_code'<>'terminal_status' then raise exception 'expected terminal: %',e; end if;
            insert into ai_suppressions(prospect_record_id,scope,suppression_type,active) values(p1,'global','do_not_call',true);
            e:=ai_evaluate_call_eligibility(c,p1,now()); if e->>'reason_code'<>'suppressed_or_dnc' then raise exception 'expected DNC: %',e; end if;
            delete from ai_suppressions where prospect_record_id=p1;
            insert into ai_callbacks(campaign_id,prospect_record_id,status,scheduled_for,lead_timezone) values(c,p1,'scheduled',now()+interval '1 hour','Europe/Brussels');
            e:=ai_evaluate_call_eligibility(c,p1,now()); if e->>'reason_code'<>'callback_scheduled' then raise exception 'expected callback: %',e; end if;
            update ai_callbacks set scheduled_for=now()-interval '1 minute',status='due' where prospect_record_id=p1;
            e:=ai_evaluate_call_eligibility(c,p1,now()); if e->>'reason_code'<>'eligible' or (e->>'callback_due')::boolean<>true then raise exception 'due callback should be eligible: %',e; end if;
            select count(*) into n from ai_queue_campaign_eligible(c,1,now()) where queued; if n<>1 then raise exception 'expected one queued'; end if;
            e:=ai_evaluate_call_eligibility(c,p1,now()); if e->>'reason_code'<>'prospect_already_queued_or_active' then raise exception 'duplicate prospect protection missing: %',e; end if;
          end $$;
          SQL

      - name: DST-aware and window tests
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare c uuid:=gen_random_uuid(); p uuid:=gen_random_uuid(); e jsonb;
          begin
            insert into ai_call_campaigns(id,name,status,enabled,timezone_strategy,fixed_timezone,calling_days,calling_window_start,calling_window_end,max_attempts_per_prospect,min_retry_delay_minutes,max_calls_per_day,max_connected_minutes_per_day,max_concurrent_calls)
            values(c,'DST','active',true,'fixed','Europe/Brussels',array[0,1,2,3,4,5,6],time '09:00',time '17:00',3,0,100,600,10);
            insert into crm_records(id,type,payload) values(p,'stats',jsonb_build_object('phone','+32471111111','status','dialed'));
            e:=ai_evaluate_call_eligibility(c,p,'2026-07-15 08:00:00+00'); if e->>'reason_code'<>'eligible' then raise exception 'summer DST expected 10:00 local eligible: %',e; end if;
            e:=ai_evaluate_call_eligibility(c,p,'2026-01-15 07:00:00+00'); if e->>'reason_code'<>'outside_calling_window' then raise exception 'winter expected 08:00 local outside: %',e; end if;
          end $$;
          SQL

      - name: Race and duplicate integration test
        run: |
          cat > /tmp/setup.sql <<'SQL'
          select id as cid from ai_call_campaigns where name='Test' limit 1 \gset
          insert into crm_records(id,type,payload) values('11111111-1111-4111-8111-111111111111','stats','{"phone":"+32479999999","timezone":"Europe/Brussels","status":"dialed"}') on conflict do nothing;
          SQL
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/setup.sql
          CID=$(psql -h localhost -U postgres -d postgres -Atc "select id from ai_call_campaigns where name='Test' limit 1")
          (psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select * from ai_queue_campaign_eligible('$CID',10,now())" >/tmp/q1 2>&1) &
          P1=$!
          (psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select * from ai_queue_campaign_eligible('$CID',10,now())" >/tmp/q2 2>&1) &
          P2=$!
          wait $P1; wait $P2
          COUNT=$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from ai_call_attempts where prospect_record_id='11111111-1111-4111-8111-111111111111' and status='queued'")
          test "$COUNT" = "1"
