name: Phase 6 checks
on:
  push:
    branches: [phase6-twilio-telephony, phase7-realtime-voice-agent, phase7-groq-llm, phase7-human-caller-hardening, phase7-latency-rate-playback-hardening, phase7-groq-400-latency-fix, main]
  workflow_dispatch:

jobs:
  phase6:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      TWILIO_CONTROLLED_TEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reproducible npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Phase 6 Node tests
        run: npm run test:phase6
      - name: Phase 7 Node tests
        run: npm run test:phase7
      - name: Vite production build
        run: npm run build

      - name: Prepare Supabase-compatible PostgreSQL
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin; exception when duplicate_object then null; end $$;
          create schema if not exists auth;
          create table if not exists auth.users(id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          create table if not exists public.crm_records(
            id uuid primary key default gen_random_uuid(),
            type text not null,
            payload jsonb not null default '{}'::jsonb,
            created_by uuid references auth.users(id),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          SQL

      - name: Apply fresh Phase 3-7 migrations
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812010000_ai_voice_phase3_foundation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812020000_ai_voice_phase4_admin_fields.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812030000_ai_voice_phase5_eligibility.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812040000_ai_voice_phase6_twilio.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260814010000_ai_voice_phase7_realtime.sql

      - name: Phase 5 regression suite
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/phase5-regression.sql
      - name: Phase 6 regression suite
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/phase6-db.sql
      - name: Phase 7 regression suite
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/phase7-db.sql

      - name: Concurrent controlled reservation race
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          update ai_call_attempts
             set created_at=now()-interval '5 minutes',
                 status=case when status in ('queued','claimed','initiating','ringing','connected','active_conversation') then 'cancelled' else status end,
                 ended_at=case when status in ('queued','claimed','initiating','ringing','connected','active_conversation') then now()-interval '4 minutes' else ended_at end,
                 completed_at=case when status in ('queued','claimed','initiating','ringing','connected','active_conversation') then now()-interval '4 minutes' else completed_at end,
                 lock_token=null,locked_by=null,locked_at=null,lock_expires_at=null
           where controlled_test;
          insert into ai_call_campaigns(id,name,status,enabled,telephony_provider_slug,timezone_strategy,fixed_timezone,calling_days,calling_window_start,calling_window_end,max_attempts_per_prospect,min_retry_delay_minutes,max_calls_per_day,max_connected_minutes_per_day,max_concurrent_calls)
          values('66666666-6666-4666-8666-666666666666','Race','active',true,'twilio','fixed','Europe/Brussels',array[0,1,2,3,4,5,6],time '00:00',time '23:59',10,0,100,600,10);
          insert into crm_records(id,type,payload) values
          ('66666666-6666-4666-8666-666666666661','stats','{"phone":"+32475555001","status":"dialed"}'),
          ('66666666-6666-4666-8666-666666666662','stats','{"phone":"+32475555002","status":"dialed"}');
          SQL
          (psql -h localhost -U postgres -d postgres -Atc "select ai_reserve_controlled_test_attempt('66666666-6666-4666-8666-666666666666','+32475555001','phase6_race_request_0001',60)" >/tmp/race1 2>&1) & P1=$!
          (psql -h localhost -U postgres -d postgres -Atc "select ai_reserve_controlled_test_attempt('66666666-6666-4666-8666-666666666666','+32475555002','phase6_race_request_0002',60)" >/tmp/race2 2>&1) & P2=$!
          wait $P1; wait $P2
          cat /tmp/race1 /tmp/race2
          COUNT=$(psql -h localhost -U postgres -d postgres -Atc "select count(*) from ai_call_attempts where origin_request_key in ('phase6_race_request_0001','phase6_race_request_0002')")
          test "$COUNT" = "1"

      - name: Static safety assertions
        run: |
          grep -q "TWILIO_CONTROLLED_TEST_ENABLED" api/ai-controlled-test-call.js api/_telephony/server.js
          grep -q "Bulk live dialing is disabled" api/ai-controlled-test-call.js
          grep -q "ai_reserve_controlled_test_attempt" api/ai-controlled-test-call.js
          grep -q "ai_reserve_voice_session" api/ai-controlled-test-call.js
          grep -q "ai_append_transcript_segment" api/_voice/orchestrator.js
          grep -q "persistDnc" api/_voice/orchestrator.js
          grep -q "validateRequest" api/voice-media.js
          grep -q "stale_sequence" supabase/migrations/20260812040000_ai_voice_phase6_twilio.sql
          grep -q "terminal_regression_blocked" supabase/migrations/20260812040000_ai_voice_phase6_twilio.sql
          ! grep -R "Start AI Campaign" src
          ! grep -R "TWILIO_AUTH_TOKEN\|DEEPGRAM_API_KEY\|OPENAI_API_KEY\|GROQ_API_KEY" src

      - name: Confirm CI has no real provider credentials
        run: |
          test "$TWILIO_CONTROLLED_TEST_ENABLED" = "false"
          test -z "$TWILIO_ACCOUNT_SID"
          test -z "$TWILIO_AUTH_TOKEN"
          test -z "$TWILIO_FROM_NUMBER"
          test -z "$DEEPGRAM_API_KEY"
          test -z "$OPENAI_API_KEY"
          test -z "$GROQ_API_KEY"
