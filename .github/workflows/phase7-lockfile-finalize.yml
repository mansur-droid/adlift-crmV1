name: Phase 7 checks
on:
  workflow_dispatch:
  push:
    branches: [phase7-realtime-voice-agent, main]
jobs:
  phase7:
    runs-on: ubuntu-latest
    env:
      TWILIO_CONTROLLED_TEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Phase 6 regression tests
        run: npm run test:phase6
      - name: Phase 7 regression tests
        run: npm run test:phase7
      - name: Production build
        run: npm run build
      - name: Confirm no provider credentials in CI
        run: |
          test "$TWILIO_CONTROLLED_TEST_ENABLED" = "false"
          test -z "$TWILIO_ACCOUNT_SID"
          test -z "$TWILIO_AUTH_TOKEN"
          test -z "$TWILIO_FROM_NUMBER"
          test -z "$DEEPGRAM_API_KEY"
          test -z "$OPENAI_API_KEY"
