name: Phase 3 checks

on:
  push:
    branches:
      - phase3-ai-voice-database
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Report lockfile state
        run: |
          if npm ci --ignore-scripts --no-audit --no-fund; then
            echo "LOCKFILE_SYNCED=true" >> "$GITHUB_ENV"
          else
            echo "Existing package-lock.json is out of sync; using npm install for the build check."
            echo "LOCKFILE_SYNCED=false" >> "$GITHUB_ENV"
            rm -rf node_modules
          fi

      - name: Install dependencies for build
        if: env.LOCKFILE_SYNCED == 'false'
        run: npm install --no-audit --no-fund

      - name: Build CRM
        run: npm run build

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal Supabase-compatible Postgres roles and schema
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          do $$ begin create role anon; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role; exception when duplicate_object then null; end $$;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          create table if not exists public.crm_records (
            id uuid primary key default gen_random_uuid(),
            type text not null,
            payload jsonb not null default '{}'::jsonb,
            created_by uuid references auth.users(id),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          SQL

      - name: Apply Phase 3 migration
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260812010000_ai_voice_phase3_foundation.sql

      - name: Verify Phase 3 tables, RLS and queue function
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing text[];
            rls_missing text[];
          begin
            select array_agg(expected.name)
            into missing
            from (values
              ('ai_provider_configs'),
              ('ai_call_campaigns'),
              ('ai_campaign_instructions'),
              ('ai_company_knowledge'),
              ('ai_company_regulations'),
              ('ai_call_attempts'),
              ('ai_call_events'),
              ('ai_provider_webhook_events'),
              ('ai_transcript_segments'),
              ('ai_callbacks'),
              ('ai_suppressions'),
              ('ai_recordings'),
              ('ai_call_outcomes'),
              ('ai_pre_call_briefs'),
              ('ai_pre_call_brief_facts'),
              ('ai_pre_call_brief_fact_evidence')
            ) as expected(name)
            where to_regclass('public.' || expected.name) is null;

            if missing is not null then
              raise exception 'Missing Phase 3 tables: %', missing;
            end if;

            select array_agg(c.relname)
            into rls_missing
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname like 'ai_%'
              and c.relkind = 'r'
              and c.relrowsecurity = false;

            if rls_missing is not null then
              raise exception 'RLS not enabled on: %', rls_missing;
            end if;

            if to_regprocedure('public.ai_claim_next_call_attempt(text,integer,uuid)') is null then
              raise exception 'Queue claim function missing';
            end if;
          end $$;
          SQL

      - name: Verify stats prospect guard and duplicate-call protection
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id) values ('00000000-0000-0000-0000-000000000001');
          insert into public.crm_records(id,type,payload,created_by)
          values ('10000000-0000-0000-0000-000000000001','stats','{}','00000000-0000-0000-0000-000000000001');

          insert into public.ai_call_campaigns(id,name,status,enabled)
          values ('20000000-0000-0000-0000-000000000001','Smoke','active',true);

          insert into public.ai_call_attempts(
            id,campaign_id,prospect_record_id,phone_e164,attempt_number,status
          ) values (
            '30000000-0000-0000-0000-000000000001',
            '20000000-0000-0000-0000-000000000001',
            '10000000-0000-0000-0000-000000000001',
            '+15551234567',1,'queued'
          );

          do $$
          begin
            begin
              insert into public.ai_call_attempts(
                campaign_id,prospect_record_id,phone_e164,attempt_number,status
              ) values (
                '20000000-0000-0000-0000-000000000001',
                '10000000-0000-0000-0000-000000000001',
                '+15551234567',2,'queued'
              );
              raise exception 'Duplicate active prospect was not blocked';
            exception when unique_violation then
              null;
            end;
          end $$;
          SQL
